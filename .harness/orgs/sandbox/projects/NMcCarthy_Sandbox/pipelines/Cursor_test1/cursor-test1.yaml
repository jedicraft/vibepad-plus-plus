pipeline:
  name: Cursor_test1
  identifier: Cursor_test1
  projectIdentifier: NMcCarthy_Sandbox
  orgIdentifier: sandbox
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: jedicraftGitHub
        repoName: vibepad-plus-plus
        build: <+input>
  stages:
    - stage:
        name: CI Build
        identifier: CI_Build
        description: Build and test (CI)
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install and Build
                  identifier: Install_and_Build
                  spec:
                    connectorRef: account.DockerHub
                    image: node:20-alpine
                    shell: Sh
                    command: |-
                      set -e
                      node --version
                      npm --version
                      npm install
                      npm run lint
                      npm run build
    - stage:
        name: STO Security Scan
        identifier: STO_Security_Scan
        description: Security Testing Orchestration (Semgrep)
        type: SecurityTests
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Semgrep
                  name: Semgrep_orchestration
                  identifier: Semgrep_orchestration
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: auto
                    advanced:
                      log:
                        level: info
    - stage:
        name: CD Deploy
        identifier: CD_Deploy
        description: Kubernetes deployment (CD)
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: vibepadlocal
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: <+input>
                      sources: <+input>
          environment:
            environmentRef: nmccarthylocal
            deployToAll: false
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - step:
                  name: Rollout Deployment
                  identifier: rolloutDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  name: Rollback Rollout Deployment
                  identifier: rollbackRolloutDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
